name: Build Windows App

# Builds the Dominant CRM desktop app (thin Electron client for the
# Railway-hosted server) natively on a Windows runner — no wine needed.
#
# Run it two ways:
#   1. Actions tab → "Build Windows App" → "Run workflow" (manual) — the
#      built .exe files show up under that run's "Artifacts".
#   2. Push a version tag (e.g. `git tag v1.0.1 && git push --tags`) — this
#      additionally publishes a GitHub Release with the .exe files attached,
#      giving a permanent public download link.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Electron app dependencies
        working-directory: electron
        run: npm install

      - name: Build installer + portable exe
        working-directory: electron
        run: npx electron-builder --win nsis portable

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dominant-crm-windows
          path: electron/dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
          generate_release_notes: true
